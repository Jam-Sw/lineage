<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lineage app icon">
  <title>Lineage</title>
  <defs>
    <clipPath id="lineage-squircle">
      <rect x="16" y="16" width="480" height="480" rx="96"></rect>
    </clipPath>
    <linearGradient id="lineage-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1729"></stop>
      <stop offset="100%" stop-color="#1a2744"></stop>
    </linearGradient>
    <radialGradient id="lineage-orb" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#93c5fd"></stop>
      <stop offset="100%" stop-color="#3b82f6"></stop>
    </radialGradient>
  </defs>

  
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#lineage-bg)"></rect>

