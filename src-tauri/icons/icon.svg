<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Lineage app icon">
  <title>Lineage</title>
  <defs>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.36" numOctaves="2" seed="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" result="gray" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/>
      <feComponentTransfer in="gray" result="stipple">
        <feFuncR type="linear" slope="1.45" intercept="-0.22"/>
        <feFuncG type="linear" slope="1.45" intercept="-0.22"/>
        <feFuncB type="linear" slope="1.45" intercept="-0.22"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="stipple" mode="overlay"/>
    </filter>
    <clipPath id="n1"><circle cx="296" cy="744" r="22"/></clipPath>
    <clipPath id="n2"><circle cx="352" cy="680" r="28"/></clipPath>
    <clipPath id="n3"><circle cx="400" cy="608" r="36"/></clipPath>
