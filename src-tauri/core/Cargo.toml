[package]
name = "lineage-core"
version = "0.1.0"
description = "Lineage core - GitHub repo discovery, churn engine, language mapping, aggregation. No UI, no Tauri."
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = { version = "2" }
rayon = "1"

[dev-dependencies]
tempfile = "3"
