[workspace]
members = ["core"]
resolver = "2"

[package]
name = "lineage"
version = "0.2.0"
description = "Lineage - your GitHub lifetime, live in the menu bar"
edition = "2021"

[lib]
name = "lineage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
lineage-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
